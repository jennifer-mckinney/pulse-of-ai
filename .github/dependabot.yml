# Dependabot proposes (never merges) updates for the pinned images, the
# GitHub Actions and the dev/test requirements (python/requirements.txt).
# Digest pins are bumped with their tags; every bump goes through CI and
# review like any other change. The hash-locked embeddings-service lock
# (python/requirements-service.*, F9-6) is refreshed by hand: see below.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/python"
    schedule:
      interval: weekly
  # The queue store (compose service `redis`) is valkey/valkey 8.x. Dependabot
  # proposes 8.x updates; a major bump (9.x) is a reviewed decision, not a
  # weekly PR. The CI service container (.github/workflows/ci.yml) is not a
  # Dependabot ecosystem: bump it by hand to the same digest in the same PR
  # (scripts/test/check-compose.sh fails if the two differ).
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]
  # pip covers python/requirements.txt only. The service lock pins the
  # CPU-only torch build (torch==X.Y.Z+cpu), published only on the PyTorch
  # index. Dependabot's pip-compile run cannot resolve it from PyPI alone
  # (run 36672894127), and giving it the PyTorch index as a registry turns off
  # external code execution, so the job then fails with
  # unexpected_external_code (run 36688426413). Enabling
  # insecure-external-code-execution was declined, so the lock is excluded
  # here and refreshed by hand with the pip-compile command documented in
  # python/requirements-service.in (decision: Jennifer McKinney, 2026-09-30).
  # Both patterns are listed on purpose: the docs define exclude-paths
  # relative to `directory`, while dependabot-core's fetcher matches the
  # repo-relative path of each file it lists.
  - package-ecosystem: pip
    directory: "/python"
    exclude-paths:
      - "requirements-service.*"
      - "python/requirements-service.*"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
