# Dependabot proposes (never merges) updates for the pinned images and the
# hash-locked embeddings requirements (F9-6). Digest pins are bumped with
# their tags; every bump goes through CI and review like any other change.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/python"
    schedule:
      interval: weekly
  # The queue store (compose service `redis`) is valkey/valkey 8.x. Dependabot
  # proposes 8.x updates; a major bump (9.x) is a reviewed decision, not a
  # weekly PR. The CI service container (.github/workflows/ci.yml) is not a
  # Dependabot ecosystem: bump it by hand to the same digest in the same PR
  # (scripts/test/check-compose.sh fails if the two differ).
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
