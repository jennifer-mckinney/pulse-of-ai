# Collector CREDENTIALS reach `worker` ONLY (F9-2), through env_file (P10-18):
# the worker loads the operator's env file (PULSE_ENV_FILE, default .env)
# whole, so no credential is hand-listed here. web is the internet-facing
# process: an RCE or debug leak there must not expose paid API keys via
# /proc/self/environ, so web never loads the env file — it gets the settings
# and a presence marker per credential (below); migrate / populate get
# neither. scripts/test/check-compose.sh fails if a credential value reaches
# another role, and tests/unit/pure/sourceEnv.test.js holds the lists.

# Presence markers for web (F9-2): the literal "set" when the credential is
# set in the env file, empty otherwise — web reports each source's gate
# status (GET /api/sources, the health drawer) without holding the secret.
x-collector-presence: &collector-presence
  META_CONTENT_LIBRARY_EXPORT_DIR: ${META_CONTENT_LIBRARY_EXPORT_DIR:+set}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:+set}
  TIKTOK_RESEARCH_CLIENT_KEY: ${TIKTOK_RESEARCH_CLIENT_KEY:+set}
  TIKTOK_RESEARCH_CLIENT_SECRET: ${TIKTOK_RESEARCH_CLIENT_SECRET:+set}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:+set}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:+set}
  REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:+set}
  WECHAT_AUTHORIZED_FEED_URL: ${WECHAT_AUTHORIZED_FEED_URL:+set}
  WECHAT_AUTHORIZED_FEED_HOST: ${WECHAT_AUTHORIZED_FEED_HOST:+set}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:+set}
  X_BEARER_TOKEN: ${X_BEARER_TOKEN:+set}
  NYT_API_KEY: ${NYT_API_KEY:+set}
  CNN_FEED_URL: ${CNN_FEED_URL:+set}
  CNN_API_KEY: ${CNN_API_KEY:+set}
  GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:+set}
  DOWJONES_API_KEY: ${DOWJONES_API_KEY:+set}
  DOWJONES_FEED_URL: ${DOWJONES_FEED_URL:+set}
  AP_API_KEY: ${AP_API_KEY:+set}
  REUTERS_CONNECT_CLIENT_ID: ${REUTERS_CONNECT_CLIENT_ID:+set}
  REUTERS_CONNECT_CLIENT_SECRET: ${REUTERS_CONNECT_CLIENT_SECRET:+set}
  SPRINGER_API_KEY: ${SPRINGER_API_KEY:+set}
  NCBI_API_KEY: ${NCBI_API_KEY:+set}
  NCBI_EMAIL: ${NCBI_EMAIL:+set}
  ELSEVIER_API_KEY: ${ELSEVIER_API_KEY:+set}
  SCHOLAR_ALERTS_IMAP_HOST: ${SCHOLAR_ALERTS_IMAP_HOST:+set}
  SCHOLAR_ALERTS_IMAP_USER: ${SCHOLAR_ALERTS_IMAP_USER:+set}
  SCHOLAR_ALERTS_IMAP_PASSWORD: ${SCHOLAR_ALERTS_IMAP_PASSWORD:+set}
  RESEARCHGATE_DATASET_PATH: ${RESEARCHGATE_DATASET_PATH:+set}
  IEEE_API_KEY: ${IEEE_API_KEY:+set}
  JSTOR_DATASET_PATH: ${JSTOR_DATASET_PATH:+set}
  GOVINFO_API_KEY: ${GOVINFO_API_KEY:+set}
  CONGRESS_API_KEY: ${CONGRESS_API_KEY:+set}
  GITHUB_TOKEN: ${GITHUB_TOKEN:+set}
  GITLAB_TOKEN: ${GITLAB_TOKEN:+set}
  HF_TOKEN: ${HF_TOKEN:+set}
  STACKEXCHANGE_KEY: ${STACKEXCHANGE_KEY:+set}
  REUTERS_CONNECT_TOKEN_URL: ${REUTERS_CONNECT_TOKEN_URL:+set}
  REUTERS_CONNECT_API_URL: ${REUTERS_CONNECT_API_URL:+set}

# Shared definition for every Node service of the full solution (migrate,
# web, worker, populate): ONE image (./Dockerfile), role picked by `command`.
x-app: &app
  image: ${PULSE_APP_IMAGE:-pulse-of-ai/app:local}
  # Built ONCE, by the web service (see there); the other roles reuse the tag
  # and never try to pull it from a registry.
  pull_policy: never
  profiles: ["full"]
  restart: unless-stopped
  logging: *logging
  environment:
    <<: *app-env

services:
  # Primary database — PostgreSQL 16 with pgvector extension
  postgres:
    logging: *logging
    # pgvector/pgvector:pg16, pinned by digest (F9-6); bump deliberately.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse_of_ai}
      POSTGRES_USER: ${POSTGRES_USER:-pulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Host port on loopback by default (F9-1): Docker publishes a port with
    # no host IP on EVERY interface (and bypasses ufw on Linux).
    # PULSE_BIND_ADDR=0.0.0.0 opts in to exposing it, together with web.
    ports:
      - "${PULSE_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_user} -d ${POSTGRES_DB:-pulse_of_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Isolated test database — separate port, separate volume, wiped per test suite
  postgres_test:
    logging: *logging
    # pgvector/pgvector:pg16, pinned by digest (F9-6); bump deliberately.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-pulse_of_ai_test}
      POSTGRES_USER: ${POSTGRES_USER:-pulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${PULSE_BIND_ADDR:-127.0.0.1}:${POSTGRES_TEST_PORT:-5433}:5432"
    # No volume mount — ephemeral; data lost on container restart (intentional for tests)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_user} -d ${POSTGRES_TEST_DB:-pulse_of_ai_test}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (Redis protocol) — BullMQ job queue backend for the event-driven
  # pipeline. The service keeps the name "redis" so REDIS_HOST=redis holds.
  # AOF persistence (appendonly yes) ensures in-flight jobs survive container restarts.
  # At 10K+ events per 2-3 minute cycle across 50 sources, job durability is non-negotiable.
  #
  # Password required (F9-1): REDIS_PASSWORD (generated by npm run standup)
  # is written to a config file instead of valkey-server's argv, so `ps` on
  # the host never shows it; the image's own entrypoint then starts
  # valkey-server with its usual privilege drop to the `valkey` user.
  # Backslashes and double quotes are escaped for the config file's quoting.
  redis:
    logging: *logging
    # Valkey (BSD-3-Clause, Linux Foundation) replaces redis:7-alpine, whose
    # later releases moved to RSALv2/SSPL. It speaks the Redis protocol, so
    # BullMQ, the REDIS_* variables and the service name "redis" are unchanged.
    # valkey/valkey:8.1.10-alpine, pinned by digest (F9-6); bump deliberately
    # (Dependabot proposes 8.x patches; a major bump is a reviewed decision).
    # Volume note: the data lives in a NEW volume, valkey_data. Redis 7.4
    # writes RDB format 12, which Valkey 8 refuses to load ("Can't handle RDB
    # format version 12", even with rdb-version-check relaxed), so reusing
    # redis_data would crash-loop an upgraded stack. Nothing is lost by
    # starting empty: the queue data is transient — the worker re-registers
    # every collection and maintenance schedule when it starts, and the
    # heartbeat and refresh debounce are short-lived keys. Only one-off jobs
    # still waiting at the moment of the switch are dropped (the next
    # collection run re-fetches their items), so stop the stack cleanly first
    # (docker stop gives the worker 180 s to finish in-flight jobs). The old
    # <project>_redis_data volume is left in place, unused; remove it by
    # hand once the stack is healthy (docker volume rm <project>_redis_data).
    image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (npm run standup generates it)}
    command:
      - sh
      - -c
      - |
        umask 077
        pw=$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')
        printf 'requirepass "%s"\n' "$$pw" > /tmp/valkey-auth.conf
        chown valkey:valkey /tmp/valkey-auth.conf
        exec docker-entrypoint.sh valkey-server /tmp/valkey-auth.conf --appendonly yes --appendfsync everysec
    ports:
      - "${PULSE_BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    # Authenticated ping; REDISCLI_AUTH (valkey-cli 8 still reads that name)
    # keeps the password out of argv.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Full solution (profile "full") ──────────────────────────────────────
  # Everything below is OPT-IN. The default profile (`npm run docker:up`,
  # bare `docker compose up -d`) still starts only postgres, postgres_test and
  # redis. `npm run standup` (scripts/standup.sh) activates "full" (and
  # "demo" for the population feed) and waits for health.
  #
  # Inside the compose network the app reaches postgres:5432 and redis:6379
  # directly; the *_PORT host-port variables above only move the published
  # ports, so a second stack can run beside the dev one.

  # One-shot: apply pending migrations, then the idempotent registry seed.
  # web, worker and the population feed wait for it to EXIT 0.
  migrate:
    <<: *app
    command: ["sh", "-c", "node scripts/migrate.js && node scripts/seed.js"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  # Express API + the static frontend (public/) on one port.
  web:
    <<: *app
    # The only build definition for the app image. One build target (not one
    # per role) plus no provenance/SBOM attestations (standup also sets
    # BUILDX_NO_DEFAULT_ATTESTATIONS=1) keeps the image ID stable across cached
    # rebuilds, so re-running standup leaves running containers alone instead
    # of recreating them.
    build:
      context: .
      dockerfile: Dockerfile
      provenance: false
      sbom: false
    pull_policy: missing
    command: ["node", "src/server.js"]
    # Source status only: settings plus presence markers, never a credential.
    environment:
      <<: [*app-env, *collector-settings, *collector-presence]
      # F10-8: POST /api/refresh requires REFRESH_TOKEN (X-Refresh-Token)
      # when the published address is beyond loopback.
      PULSE_BIND_ADDR: ${PULSE_BIND_ADDR:-127.0.0.1}
      # The process listens on every container interface behind Docker's
      # port publish; the published address decides exposure (src/server.js).
      HOST: 0.0.0.0
      PULSE_CONTAINER_PUBLISHED_ADDR: ${PULSE_BIND_ADDR:-127.0.0.1}
      REFRESH_TOKEN: ${REFRESH_TOKEN:-}
      REFRESH_STALE_MINUTES: ${REFRESH_STALE_MINUTES:-30}
    ports:
      - "${PULSE_BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # BullMQ workers — src/workers/start.js is the only worker entry point:
  # the collection scheduler + collect.{rss,api,bulk} consumers (live data
  # from the source registry, ADR 0001), ingest retries, embed, correlate.
  # Depends on embeddings being STARTED, not healthy:
  # if the model download fails the rest of the stack still comes up (embed
  # jobs retry with backoff), and standup reports embeddings as unavailable.
  worker:
    <<: *app
    command: ["node", "src/workers/start.js"]
    # The only role with collector credentials (F9-2): the operator's env
    # file, whole (P10-18). `environment` below still wins for the container
    # settings (app-env fixes the database and Redis hosts to the network).
    env_file:
      - path: ${PULSE_ENV_FILE:-.env}
        required: false
    environment:
      <<: [*app-env, *collector-settings]
    # Healthy = the worker's heartbeat file is fresh (P9-7). It is written
    # every 15 s only after the heartbeat reached Redis, so a stuck worker or
    # one that lost Redis turns unhealthy (src/workers/heartbeat.js).
    healthcheck:
      test: ["CMD", "node", "src/workers/healthcheck.js"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    # SIGTERM → w.close() waits for in-flight jobs; an embed job retrying
    # with exponential backoff can take minutes, so give it 3 minutes
    # before SIGKILL (P9-7).
    stop_grace_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      embeddings:
        condition: service_started

  # FastAPI + sentence-transformers. The model downloads on first start into
  # the hf_cache volume and is reused by every later start / rebuild.
  embeddings:
    logging: *logging
    image: ${PULSE_EMBEDDINGS_IMAGE:-pulse-of-ai/embeddings:local}
    build:
      context: ./python
      dockerfile: Dockerfile
      provenance: false   # see x-app: stable image IDs across cached rebuilds
      sbom: false
    profiles: ["full"]
    restart: unless-stopped
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBED_MODEL_REVISION: ${EMBED_MODEL_REVISION:-1110a243fdf4706b3f48f1d95db1a4f5529b4d41}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-64}
    # No `ports:` (F9-8): the API is unauthenticated and only the worker
    # needs it (embeddings:8000 on the compose network). Publishing it —
    # even behind PULSE_BIND_ADDR — would let anyone who can reach the host
    # burn its CPU through /embeddings. standup checks it via compose exec.
    volumes:
      - hf_cache:/home/app/.cache/huggingface

  # Demo FALLBACK loop (profile "demo"). The worker collects live data from
  # the 52-source registry; this loop writes a FICTIONAL demo batch through
  # the real pipeline every DEMO_FEED_INTERVAL_MS ONLY while the trailing
  # hour holds no live posts — see scripts/populate.js. Started by
  # scripts/standup.sh.
  populate:
    <<: *app
    profiles: ["demo"]
    command: ["node", "scripts/populate.js", "--loop"]
    # Collector settings only: its one-shot collection (--once) runs the
    # keyless sources; keyed sources are collected by the worker (F9-2).
    environment:
      <<: [*app-env, *collector-settings]
    healthcheck:
      disable: true
    # SIGTERM lets an in-flight batch finish (its job row completes), then
    # the feed exits without sleeping and closes Redis + the DB pool. 30 s
    # covers a batch; the default 10 s could SIGKILL it mid-cleanup.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local
  # Valkey queue data (the old redis_data volume is not reused; see redis).
  valkey_data:
    driver: local
  # sentence-transformers model cache (embeddings service, profile "full")
  hf_cache:
    driver: local
