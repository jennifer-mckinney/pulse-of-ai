services:
  # Primary database — PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse_of_ai}
      POSTGRES_USER: ${POSTGRES_USER:-pulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_user} -d ${POSTGRES_DB:-pulse_of_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Isolated test database — separate port, separate volume, wiped per test suite
  postgres_test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-pulse_of_ai_test}
      POSTGRES_USER: ${POSTGRES_USER:-pulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    # No volume mount — ephemeral; data lost on container restart (intentional for tests)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_user} -d ${POSTGRES_TEST_DB:-pulse_of_ai_test}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
