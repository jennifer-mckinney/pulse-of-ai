# pyproject.toml
# Python project configuration for Pulse of AI.
# Pytest and pytest-asyncio settings live here so they apply when running
# python -m pytest python/tests/... from the project root.

[tool.black]
line-length = 100
# py311 is the oldest interpreter the code must parse on: CI's lint-python job
# runs black and pytest on Python 3.11 (the image runs 3.13, which parses
# anything formatted for 3.11). Listing py312 made black on 3.11 warn that it
# cannot parse code formatted for 3.12 and weakened its AST safety check.
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
# AUTO mode: all async test functions and async fixtures are handled by
# pytest-asyncio automatically — no @pytest.mark.asyncio or
# @pytest_asyncio.fixture decorators required.
asyncio_mode = "auto"
